sets:
  agentic:
    description: Agentic suite
    tasks:
      - name: inspect_evals/agentharm
        args:
          - -T
          - refusal_judge={{judge_model}}
          - -T
          - semantic_judge={{judge_model}}
          - --max-tokens
          - "512"
      - name: inspect_evals/agentharm_benign
        args:
          - -T
          - refusal_judge={{judge_model}}
          - -T
          - semantic_judge={{judge_model}}
          - --max-tokens
          - "512"
      - name: inspect_evals/agentdojo
        args:
          - -T
          - with_sandbox_tasks=no
          - -T
          - workspace=banking
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "25"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  fundamentals:
    description: Broad inspect_evals fundamentals set
    tasks:
      - name: inspect_evals/gsm8k
        args:
          - --max-tokens
          - "2048"
      - name: inspect_evals/ifeval
        args:
          - --max-tokens
          - "3072"
      - name: ifeval-da
        args:
          - --max-tokens
          - "3072"
      - name: inspect_evals/truthfulqa
        args:
          - --max-tokens
          - "512"
      - name: generative-talemaader
        args:
          - -T
          - judge_model={{judge_model}}
          - -T
          - max_gen_toks=128
      - danish-citizen-tests
      - dala
      - gec_dala
      - name: wmt24pp-en-da
        args:
          - -T
          - max_gen_toks=512
      - name: multi_wiki_qa
        args:
          - -T
          - max_gen_toks=32
      - name: andersen-modernization
        args:
          - -T
          - max_gen_toks=1536
      - name: inspect_evals/bfcl
        args:
          - --max-tokens
          - "1024"
          - --message-limit
          - "24"
      - name: ruler
        args:
          - -T
          - variant=qa_1
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=qa_2
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  bfcl_only:
    description: BFCL-only rerun suite using the upstream inspect_evals task
    tasks:
      - name: inspect_evals/bfcl
        args:
          - --max-tokens
          - "1024"
          - --message-limit
          - "24"
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  wmt24pp_en_da:
    description: WMT24++ English-to-Danish translation task
    tasks:
      - name: wmt24pp-en-da
        args:
          - -T
          - max_gen_toks=512
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  ruler_only:
    description: RULER-only suite for long-context spot checks and table refreshes
    tasks:
      - name: ruler
        args:
          - -T
          - variant=qa_1
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=qa_2
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=8192
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=16
          - -T
          - max_seq_length=32768
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
  openthoughts_tblite:
    description: inspect_harbor OpenThoughts-TBLite suite (requires inspect-harbor; sample failures are logged without aborting the full eval)
    tasks:
      - inspect_harbor/openthoughts_tblite
    args:
      - --model
      - "{{target_model}}"
      - --no-fail-on-error
      - --continue-on-fail
      - --message-limit
      - "100"
      - --limit
      - "250"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  mc9:
    description: FlexOlmo MC9 multiple-choice suite (9 tasks, 0-shot)
    tasks:
      - inspect_evals/arc_easy
      - inspect_evals/arc_challenge
      - inspect_evals/boolq
      - inspect_evals/commonsense_qa
      - inspect_evals/hellaswag
      - inspect_evals/piqa
      - name: inspect_evals/winogrande
        args:
          - -T
          - fewshot=false
      - dfm_evals/openbookqa
      - dfm_evals/socialiqa
    args:
      - --model
      - "{{target_model}}"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
      - --max-tokens
      - "64"
  gen5:
    description: FlexOlmo Gen5 generative QA suite (5 tasks, 0-shot)
    tasks:
      - dfm_evals/squad
      - name: inspect_evals/drop
        args:
          - -T
          - fewshot=false
      - dfm_evals/coqa
      - dfm_evals/nq_open
      - dfm_evals/triviaqa
    args:
      - --model
      - "{{target_model}}"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
      - --max-tokens
      - "128"
  code4:
    description: FlexOlmo Code4 code generation suite (4 tasks)
    tasks:
      - name: dfm_evals/humaneval
        args:
          - -T
          - sandbox=local
      - name: dfm_evals/humaneval_plus
        args:
          - -T
          - sandbox=local
      - name: dfm_evals/mbpp
        args:
          - -T
          - sandbox=local
      - name: dfm_evals/mbpp_plus
        args:
          - -T
          - sandbox=local
    args:
      - --model
      - "{{target_model}}"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
      - --max-tokens
      - "1024"
  flexolmo_comparison:
    description: Full FlexOlmo comparison suite (MC9 + Gen5 + Code4 + MMLU-Pro + AGIEval + BBH)
    tasks:
      - inspect_evals/arc_easy
      - inspect_evals/arc_challenge
      - inspect_evals/boolq
      - inspect_evals/commonsense_qa
      - inspect_evals/hellaswag
      - inspect_evals/piqa
      - name: inspect_evals/winogrande
        args:
          - -T
          - fewshot=false
      - dfm_evals/openbookqa
      - dfm_evals/socialiqa
      - dfm_evals/squad
      - name: inspect_evals/drop
        args:
          - -T
          - fewshot=false
      - dfm_evals/coqa
      - dfm_evals/nq_open
      - dfm_evals/triviaqa
      - name: dfm_evals/humaneval
        args:
          - -T
          - sandbox=local
          - --max-tokens
          - "1024"
      - name: dfm_evals/humaneval_plus
        args:
          - -T
          - sandbox=local
          - --max-tokens
          - "1024"
      - name: dfm_evals/mbpp
        args:
          - -T
          - sandbox=local
          - --max-tokens
          - "1024"
      - name: dfm_evals/mbpp_plus
        args:
          - -T
          - sandbox=local
          - --max-tokens
          - "1024"
      - name: dfm_evals/mmlu_pro
        args:
          - --max-tokens
          - "64"
      - name: dfm_evals/agieval
        args:
          - --max-tokens
          - "256"
      - name: dfm_evals/bbh
        args:
          - --max-tokens
          - "512"
    args:
      - --model
      - "{{target_model}}"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
  ruler_smoke:
    description: Minimal RULER smoke suite for long-context synthetic retrieval and tracing
    tasks:
      - name: ruler
        args:
          - -T
          - variant=niah_single_1
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=hf
          - -T
          - tokenizer_model=google/gemma-3-4b-it
      - name: ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=hf
          - -T
          - tokenizer_model=google/gemma-3-4b-it
    args:
      - --model
      - "{{target_model}}"
      - --limit
      - "2"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"
